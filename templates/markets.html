{% extends "layout.html" %}

{% block title %}
    Explore Markets
{% endblock %}

{% block main %}
    <h1>Top Markets</h1>
    {% for market in topMarkets %}
        <div class="market-card">
            <h3>{{ market["title"] }}</h3>
            <h4>Price: {{ market["price"] }}</h4>
            <a href="/trade?market={{ market['title'] }}">View Market</a>
        </div>
    {% endfor %}
{% endblock %}
