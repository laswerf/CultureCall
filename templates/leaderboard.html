{% extends "layout.html" %}

{% block title %}
    Leaderboard
{% endblock %}

{% block main %}
    <h1>User Leaderboard</h1>
    <div class="leaderboard-container">
        <ol>
        {% for user in userRanks %}
            <li class="leaderUser"><strong>{{ user["username"] }}</strong> — {{ pts(user["points"]) }} points</li>
        {% endfor %}
        </ol>
    </div>
{% endblock %}
